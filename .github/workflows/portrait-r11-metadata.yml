name: Portrait R11 Identity Metadata

on:
  push:
    branches:
      - feat/portrait-r11-identity-lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned EMAP checksum
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/Parasaran-Python/android-face-fusion/f38a70e4bacaab4132538421c471f9d4d3ccac00/app/src/main/assets/emap.bin"
          curl -L --fail --retry 4 "$URL" -o /tmp/emap.bin
          echo "EMAP_BYTES=$(stat -c%s /tmp/emap.bin)"
          sha256sum /tmp/emap.bin
