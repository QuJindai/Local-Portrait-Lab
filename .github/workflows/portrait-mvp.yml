name: Portrait MVP

on:
  push:
    branches:
      - main
      - feat/portrait-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_DREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
  NDK_VERSION: 28.2.13676358
  QAIRT_URL: https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.39.0.250926/v2.39.0.250926.zip

jobs:
  portrait-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Setup Flutter 3.27.4 (upstream lock-compatible baseline)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Bootstrap locked Local-Diffusion upstream
        run: bash scripts/bootstrap_upstream.sh

      - name: Verify Portrait Lab Android identity and storage policy
        run: bash scripts/verify_portrait_android.sh _build/local-diffusion

      - name: Verify localhost-only network policy
        shell: bash
        run: |
          MANIFEST=_build/local-diffusion/android/app/src/main/AndroidManifest.xml
          NETCFG=_build/local-diffusion/android/app/src/main/res/xml/portrait_network_security_config.xml
          grep -F 'android:networkSecurityConfig="@xml/portrait_network_security_config"' "$MANIFEST"
          grep -F '<domain includeSubdomains="false">127.0.0.1</domain>' "$NETCFG"
          grep -F '<domain includeSubdomains="false">localhost</domain>' "$NETCFG"
          grep -F '<base-config cleartextTrafficPermitted="false"' "$NETCFG"

      - name: Verify R7 DREAM-style native download contract
        shell: bash
        run: |
          SERVICE=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/PortraitModelDownloadService.kt
          ACTIVITY=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/MainActivity.kt
          GRADLE=_build/local-diffusion/android/app/build.gradle
          MANIFEST=_build/local-diffusion/android/app/src/main/AndroidManifest.xml
          grep -F 'PortraitModelDownloadService' "$MANIFEST"
          grep -F 'FOREGROUND_SERVICE_DATA_SYNC' "$MANIFEST"
          grep -F 'com.squareup.okhttp3:okhttp:4.12.0' "$GRADLE"
          grep -F 'OkHttpClient.Builder()' "$SERVICE"
          grep -F 'ByteArray(32 * 1024)' "$SERVICE"
          grep -F 'downloadedBytes != totalBytes' "$SERVICE"
          grep -F 'ZipInputStream' "$SERVICE"
          grep -F 'com.qujindai.localportraitlab/model_download' "$ACTIVITY"
          echo R7_NATIVE_DOWNLOAD_CONTRACT_PASS

      - name: Verify R8 standalone QNN source contract
        shell: bash
        run: |
          SERVICE=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/PortraitQnnBackendService.kt
          ACTIVITY=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/MainActivity.kt
          MANIFEST=_build/local-diffusion/android/app/src/main/AndroidManifest.xml
          ROUTER=_build/local-diffusion/lib/portrait_lab/infrastructure/portrait_backend_router_engine.dart
          grep -F 'PortraitQnnBackendService' "$MANIFEST"
          grep -F 'com.qujindai.localportraitlab/qnn_backend' "$ACTIVITY"
          grep -F 'libstable_diffusion_core.so' "$SERVICE"
          grep -F '127.0.0.1' "$SERVICE"
          grep -F '8082' "$SERVICE"
          grep -F 'DSP_LIBRARY_PATH' "$SERVICE"
          grep -F "'qnn' => _standaloneQnnEngine" "$ROUTER"
          test -s THIRD_PARTY_DREAM_QNN_NONCOMMERCIAL.md
          echo R8_STANDALONE_QNN_SOURCE_CONTRACT_PASS

      - name: Verify R9 MediaStore gallery export contract
        shell: bash
        run: |
          GALLERY=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/PortraitGalleryExporter.kt
          ACTIVITY=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/MainActivity.kt
          RESULT=_build/local-diffusion/lib/portrait_lab/ui/portrait_result_page.dart
          grep -F 'MediaStore.Images.Media.EXTERNAL_CONTENT_URI' "$GALLERY"
          grep -F 'MediaStore.Images.Media.RELATIVE_PATH' "$GALLERY"
          grep -F 'MediaStore.Images.Media.IS_PENDING' "$GALLERY"
          grep -F 'Pictures/Portrait Lab' "$GALLERY"
          grep -F 'source.inputStream().buffered()' "$GALLERY"
          grep -F 'com.qujindai.localportraitlab/gallery' "$ACTIVITY"
          grep -F '已保存到系统相册' "$RESULT"
          grep -F '生成成功，但保存到相册失败' "$RESULT"
          echo R9_MEDIASTORE_GALLERY_CONTRACT_PASS

      - name: Verify R10 persistent-model and QNN stability contract
        shell: bash
        run: |
          STORE=_build/local-diffusion/lib/portrait_lab/infrastructure/portrait_active_model_store.dart
          HOME=_build/local-diffusion/lib/portrait_lab/ui/portrait_home_page.dart
          ENGINE=_build/local-diffusion/lib/portrait_lab/infrastructure/standalone_qnn_portrait_engine.dart
          SERVICE=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/PortraitQnnBackendService.kt
          ACTIVITY=_build/local-diffusion/android/app/src/main/kotlin/com/qujindai/localportraitlab/MainActivity.kt
          ENTRY=_build/local-diffusion/lib/portrait_lab_entry.dart
          grep -F 'active_model.txt' "$STORE"
          grep -F 'FilePortraitActiveModelStore' "$STORE"
          grep -F 'NPU · QNN/HTP' "$STORE"
          grep -F '_restoreActiveModel' "$HOME"
          grep -F 'saveSelection' "$HOME"
          grep -F 'requestToken' "$ENGINE"
          grep -F '_health' "$ENGINE"
          grep -F 'for (var attempt = 0; attempt < 2; attempt++)' "$ENGINE"
          grep -F 'EXTRA_REQUEST_TOKEN' "$SERVICE"
          grep -F 'fun health(modelId: String?)' "$SERVICE"
          grep -F '"health"' "$ACTIVITY"
          grep -F 'createActiveModelStore' "$ENTRY"
          echo R10_STABILITY_CONTRACT_PASS

      - name: Resolve Flutter packages
        working-directory: _build/local-diffusion
        run: flutter pub get

      - name: Verify portrait domain, R10 stability, gallery, downloads and backend routes
        working-directory: _build/local-diffusion
        shell: bash
        run: flutter test test/portrait_lab

      - name: Prepare Android native build environment
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "ndk;${NDK_VERSION}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache
          rustup target add aarch64-linux-android
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          sudo mkdir -p /data
          sudo ln -sfn "$ANDROID_HOME/ndk/$NDK_VERSION" /data/android-ndk-r28
          test -f /data/android-ndk-r28/build/cmake/android.toolchain.cmake
          echo R10_PINNED_NDK_COMPAT_PATH_PASS

      - name: Clone pinned Local Dream QNN source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/local-dream
          mkdir -p third_party
          git clone --recursive https://github.com/xororz/local-dream.git third_party/local-dream
          cd third_party/local-dream
          git checkout "$LOCAL_DREAM_SHA"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$LOCAL_DREAM_SHA"

      - name: Apply pinned tokenizers Rust compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          RUST_FILE=third_party/local-dream/app/src/main/cpp/3rdparty/tokenizers-cpp/rust/src/lib.rs
          python3 - "$RUST_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          repls = {
              '*out_len = (*handle).decode_str.len();':
                  '*out_len = (&(*handle).decode_str).len();',
              '*out_len = (*handle).id_to_token_result.len();':
                  '*out_len = (&(*handle).id_to_token_result).len();',
          }
          for old, new in repls.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'rust compatibility anchor mismatch: {old!r}, count={count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('TOKENIZERS_RUST_COMPAT_PATCH_PASS')
          PY
          grep -Fq '(&(*handle).decode_str).len()' "$RUST_FILE"
          grep -Fq '(&(*handle).id_to_token_result).len()' "$RUST_FILE"

      - name: Download QAIRT Community SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qairt /tmp/qairt.zip
          mkdir -p /tmp/qairt
          curl -L --fail --retry 4 --retry-all-errors "$QAIRT_URL" -o /tmp/qairt.zip
          unzip -q /tmp/qairt.zip -d /tmp/qairt
          HEADER="$(find /tmp/qairt -type f -path '*/include/QNN/QnnTypes.h' -print -quit)"
          test -n "$HEADER"
          QNN_ROOT="$(dirname "$(dirname "$(dirname "$HEADER")")")"
          test -s "$QNN_ROOT/lib/aarch64-android/libQnnHtp.so"
          test -d "$QNN_ROOT/examples/QNN/SampleApp/SampleApp"
          sudo mkdir -p /data/qairt
          sudo ln -sfn "$QNN_ROOT" /data/qairt/2.39.0.250926
          test -d /data/qairt/2.39.0.250926/examples/QNN/SampleApp/SampleApp
          test -s /data/qairt/2.39.0.250926/lib/aarch64-android/libQnnHtp.so
          echo "QNN_SDK_ROOT=$QNN_ROOT" >> "$GITHUB_ENV"
          echo R10_PINNED_QAIRT_COMPAT_PATH_PASS

      - name: Build pinned Local Dream QNN native core
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          cd third_party/local-dream/app/src/main/cpp
          bash build.sh 2>&1 | tee ../../../../../../qnn-native-r10.log
          CORE=../jniLibs/arm64-v8a/libstable_diffusion_core.so
          test -s "$CORE"
          test -s ../assets/qnnlibs/libQnnHtp.so

      - name: Print QNN native failure tail
        if: failure()
        shell: bash
        run: |
          echo '===== QNN NATIVE FAILURE TAIL ====='
          tail -n 240 qnn-native-r10.log || true
          echo '===== END QNN NATIVE FAILURE TAIL ====='

      - name: Upload QNN native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-qnn-native-diagnostics
          path: |
            qnn-native-r10.log
            third_party/local-dream/app/src/main/cpp/build/**/CMakeCache.txt
            third_party/local-dream/app/src/main/cpp/build/**/CMakeFiles/CMakeOutput.log
            third_party/local-dream/app/src/main/cpp/build/**/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stage standalone QNN core into Portrait Lab
        shell: bash
        run: |
          set -euo pipefail
          APP=_build/local-diffusion/android/app/src/main
          mkdir -p "$APP/jniLibs/arm64-v8a" "$APP/assets"
          cp third_party/local-dream/app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so \
            "$APP/jniLibs/arm64-v8a/libstable_diffusion_core.so"
          rm -rf "$APP/assets/qnnlibs"
          cp -R third_party/local-dream/app/src/main/assets/qnnlibs "$APP/assets/qnnlibs"
          test -s "$APP/jniLibs/arm64-v8a/libstable_diffusion_core.so"
          test -s "$APP/assets/qnnlibs/libQnnHtp.so"
          echo R10_QNN_NATIVE_STAGE_PASS

      - name: Build Portrait Lab R10 stability-QNN debug APK
        working-directory: _build/local-diffusion
        run: flutter build apk --debug --target lib/portrait_lab_entry.dart --build-name=0.10.0-r10 --build-number=10

      - name: Verify QNN and fallback runtimes are bundled
        shell: bash
        run: |
          set -euo pipefail
          APK=_build/local-diffusion/build/app/outputs/flutter-apk/app-debug.apk
          zipinfo -1 "$APK" > /tmp/r10-apk-files.txt
          grep -Fx 'lib/arm64-v8a/libstable_diffusion_core.so' /tmp/r10-apk-files.txt
          grep -Fx 'lib/arm64-v8a/libstable-diffusion_vulkan.so' /tmp/r10-apk-files.txt
          grep -Fx 'lib/arm64-v8a/libstable-diffusion.so' /tmp/r10-apk-files.txt
          grep -F 'assets/qnnlibs/libQnnHtp.so' /tmp/r10-apk-files.txt
          echo R10_APK_RUNTIME_BUNDLE_PASS

      - name: Stage R10 APK
        shell: bash
        run: |
          mkdir -p dist
          cp _build/local-diffusion/build/app/outputs/flutter-apk/app-debug.apk \
            dist/Local-Portrait-Lab_R10_STABILITY_QNN_debug.apk
          sha256sum dist/Local-Portrait-Lab_R10_STABILITY_QNN_debug.apk | tee dist/Local-Portrait-Lab_R10_STABILITY_QNN_debug.sha256
          cp THIRD_PARTY_DREAM_QNN_NONCOMMERCIAL.md dist/

      - name: Upload Portrait Lab R10 APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-Portrait-Lab_R10_STABILITY_QNN_debug
          path: |
            dist/Local-Portrait-Lab_R10_STABILITY_QNN_debug.apk
            dist/Local-Portrait-Lab_R10_STABILITY_QNN_debug.sha256
            dist/THIRD_PARTY_DREAM_QNN_NONCOMMERCIAL.md
            qnn-native-r10.log
          if-no-files-found: error
          retention-days: 14
