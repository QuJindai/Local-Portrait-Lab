name: Portrait MVP

on:
  push:
    branches:
      - main
      - feat/portrait-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.4 (upstream lock-compatible baseline)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Bootstrap locked Local-Diffusion upstream
        run: bash scripts/bootstrap_upstream.sh

      - name: Verify Portrait Lab Android identity and storage policy
        run: bash scripts/verify_portrait_android.sh _build/local-diffusion

      - name: Resolve Flutter packages
        working-directory: _build/local-diffusion
        run: flutter pub get

      - name: Verify portrait domain, flow, download and R4 quality tests
        working-directory: _build/local-diffusion
        shell: bash
        run: |
          if [[ -d test/portrait_lab ]]; then
            flutter test test/portrait_lab
          else
            echo "No portrait tests committed yet; bootstrap baseline only."
          fi

      - name: Build Portrait Lab R4 debug APK
        working-directory: _build/local-diffusion
        run: flutter build apk --debug --target lib/portrait_lab_entry.dart --build-name=0.4.0-r4 --build-number=4

      - name: Stage R4 APK
        shell: bash
        run: |
          mkdir -p dist
          cp _build/local-diffusion/build/app/outputs/flutter-apk/app-debug.apk \
            dist/Local-Portrait-Lab_R4_debug.apk
          sha256sum dist/Local-Portrait-Lab_R4_debug.apk | tee dist/Local-Portrait-Lab_R4_debug.sha256

      - name: Upload Portrait Lab R4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-Portrait-Lab_R4_debug
          path: |
            dist/Local-Portrait-Lab_R4_debug.apk
            dist/Local-Portrait-Lab_R4_debug.sha256
          if-no-files-found: error
          retention-days: 14
