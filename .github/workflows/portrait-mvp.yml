name: Portrait MVP

on:
  push:
    branches:
      - main
      - feat/portrait-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.24.4 (upstream metadata baseline)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: stable
          cache: true

      - name: Bootstrap locked Local-Diffusion upstream
        run: bash scripts/bootstrap_upstream.sh

      - name: Resolve Flutter packages
        working-directory: _build/local-diffusion
        run: flutter pub get

      - name: Verify portrait domain tests
        working-directory: _build/local-diffusion
        shell: bash
        run: |
          if [[ -d test/portrait_lab ]]; then
            flutter test test/portrait_lab
          else
            echo "No portrait tests committed yet; bootstrap baseline only."
          fi
